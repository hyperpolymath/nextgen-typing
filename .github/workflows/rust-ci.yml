# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
#
# nextgen-typing is a coordination repo with NO Rust code (OQ-001).
# Path-gated to Rust artefacts so if any Rust file is accidentally introduced,
# the coordination-boundary guard fails loudly rather than invoking a retired
# cross-repo reusable caller.
name: Rust CI

on:
  push:
    branches: [main, master]
    paths: ['**/*.rs', '**/Cargo.toml', '**/Cargo.lock', 'crates/**']
  pull_request:
    paths: ['**/*.rs', '**/Cargo.toml', '**/Cargo.lock', 'crates/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-ci:
    name: Rust boundary check (coordination repo)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify coordination boundary forbids Rust sources
        run: ./scripts/check-coordination-boundary.sh
