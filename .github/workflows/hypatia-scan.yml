# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
#
# Self-contained Hypatia neurosymbolic security scan + SARIF upload (`category:
# hypatia`) replacing the retired reusable caller after `standards` transferred.
name: Hypatia Security Scan

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master, develop]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hypatia:
    name: Hypatia Neurosymbolic Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    env:
      HYPATIA_SHA: 'd73f76b5cb7a35e1aa1024c916aee7cb4f9b141e'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Elixir 1.19.4 / OTP 28.3 for Hypatia scanner
        uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: '1.19.4'
          otp-version: '28.3'

      - name: Build pinned Hypatia scanner
        run: |
          set -euo pipefail
          rm -rf "$HOME/hypatia"
          git init "$HOME/hypatia"
          git -C "$HOME/hypatia" remote add origin https://github.com/hyperpolymath/hypatia.git
          git -C "$HOME/hypatia" fetch --depth=1 origin "$HYPATIA_SHA"
          git -C "$HOME/hypatia" checkout --detach FETCH_HEAD
          (
            cd "$HOME/hypatia"
            mix local.hex --force
            mix local.rebar --force
            mix deps.get
            MIX_NO_PUBSUB=1 mix escript.build
          )
          chmod +x "$HOME/hypatia/hypatia" "$HOME/hypatia/hypatia-cli.sh"

      - name: Run Hypatia JSON and SARIF analysis
        id: scan
        run: |
          set -euo pipefail
          HYPATIA_FORMAT=json "$HOME/hypatia/hypatia-cli.sh" scan . --exit-zero > hypatia-findings.json
          jq -e 'type == "array"' hypatia-findings.json >/dev/null

          HYPATIA_FORMAT=sarif "$HOME/hypatia/hypatia-cli.sh" scan . --exit-zero > hypatia.sarif
          jq -e '.runs | type == "array" and length > 0' hypatia.sarif >/dev/null

          CRITICAL="$(jq '[.[] | select(.severity == "critical")] | length' hypatia-findings.json)"
          HIGH="$(jq '[.[] | select(.severity == "high")] | length' hypatia-findings.json)"
          TOTAL="$(jq 'length' hypatia-findings.json)"
          {
            echo "critical=$CRITICAL"
            echo "high=$HIGH"
            echo "total=$TOTAL"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Hypatia SARIF to GitHub Code Scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4.39.1
        with:
          sarif_file: hypatia.sarif
          category: hypatia

      - name: Enforce zero critical Hypatia findings
        env:
          CRITICAL_COUNT: ${{ steps.scan.outputs.critical }}
          HIGH_COUNT: ${{ steps.scan.outputs.high }}
          TOTAL_COUNT: ${{ steps.scan.outputs.total }}
        run: |
          set -euo pipefail
          {
            echo "## Hypatia Neurosymbolic Scan"
            echo ""
            echo "- Critical: ${CRITICAL_COUNT}"
            echo "- High: ${HIGH_COUNT}"
            echo "- Total findings: ${TOTAL_COUNT}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CRITICAL_COUNT" != "0" ]; then
            echo "::error::Hypatia reported ${CRITICAL_COUNT} critical finding(s)"
            exit 1
          fi
