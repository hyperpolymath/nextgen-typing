# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
name: Secret Scanner

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Self-contained execution of the estate secret-scanning contract pinned to
# metadatastician/standards@8e48b1caade08a552646adeab66558ac43b4360d.
# Produces the exact `scan / gitleaks` status check required by the
# Secret-Scan-Floor ruleset on `main`.
jobs:
  gitleaks:
    name: "scan / gitleaks"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: '8.18.4'
      GITLEAKS_SHA256: 'ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d'
      STANDARDS_SHA: '8e48b1caade08a552646adeab66558ac43b4360d'
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout estate gitleaks baseline
        uses: actions/checkout@v7.0.1
        with:
          repository: metadatastician/standards
          ref: 8e48b1caade08a552646adeab66558ac43b4360d
          path: .standards-baseline
          sparse-checkout: config/gitleaks
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Stage estate baseline and install pinned gitleaks
        run: |
          set -euo pipefail
          cp .standards-baseline/config/gitleaks/estate-baseline.toml .gitleaks-estate.toml
          rm -rf .standards-baseline
          test -s .gitleaks-estate.toml

          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"
          curl -sSfL --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/$TARBALL" "$URL"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${TARBALL}" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$TARBALL" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          rm -f "$RUNNER_TEMP/$TARBALL"

      - name: Gitleaks working-tree pass
        run: |
          set -euo pipefail
          CONFIG=".gitleaks-estate.toml"
          if [ -f .gitleaks.toml ]; then
            CONFIG=".gitleaks.toml"
          fi
          "$RUNNER_TEMP/gitleaks" detect \
            --source . \
            --no-git \
            --redact \
            --no-banner \
            --verbose \
            --config "$CONFIG" \
            --exit-code 1

      - name: Gitleaks full-history pass
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "::error::checkout is shallow; refusing vacuous history scan"
            exit 1
          fi
          CONFIG=".gitleaks-estate.toml"
          if [ -f .gitleaks.toml ]; then
            CONFIG=".gitleaks.toml"
          fi
          "$RUNNER_TEMP/gitleaks" detect \
            --source . \
            --redact \
            --no-banner \
            --verbose \
            --config "$CONFIG" \
            --exit-code 1

      - name: Gitleaks AsciiDoc mirror pass
        run: |
          set -euo pipefail
          MIRROR="$RUNNER_TEMP/adoc-mirror"
          rm -rf "$MIRROR"
          mkdir -p "$MIRROR"
          found=0
          while IFS= read -r -d '' f; do
            dest="$MIRROR/$(dirname "$f")"
            mkdir -p "$dest"
            cp "$f" "$dest/$(basename "$f").txt"
            found=$((found + 1))
          done < <(find . -path ./.git -prune -o \( -name '*.adoc' -o -name '*.asciidoc' \) -type f -print0)

          if [ "$found" -eq 0 ]; then
            echo "No AsciiDoc files present."
            exit 0
          fi
          CONFIG="$PWD/.gitleaks-estate.toml"
          if [ -f .gitleaks.toml ]; then
            CONFIG="$PWD/.gitleaks.toml"
          fi
          "$RUNNER_TEMP/gitleaks" detect \
            --source "$MIRROR" \
            --no-git \
            --redact \
            --no-banner \
            --config "$CONFIG" \
            --exit-code 1

  shell-secrets:
    name: "scan / shell-secrets"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run repository secret pattern hook
        run: |
          set -euo pipefail
          rc=0
          git grep -IlE '(ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82}|glpat-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' > "$RUNNER_TEMP/hits.txt" || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::error::Secret pattern scan failed with exit ${rc}"
            exit 2
          fi
          filtered="$(grep -vE '^(\.github/hooks/scan-secrets\.sh|\.github/workflows/secret-scanner\.yml|\.machine_readable/testing/adversarial-content\.k9\.ncl|tests/)' "$RUNNER_TEMP/hits.txt" || :)"
          if [ -n "$filtered" ]; then
            echo "::error::Hardcoded credential material detected:"
            printf '%s\n' "$filtered"
            exit 1
          fi
          echo "No hardcoded shell/source credentials detected."
