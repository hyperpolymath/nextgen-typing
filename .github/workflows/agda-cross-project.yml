# SPDX-License-Identifier: MPL-2.0
# Cross-project Agda compatibility gate. Pin external source revisions.
name: Cross-project Agda Verification

on:
  pull_request:
    paths:
      - 'verification/proofs/agda/**'
      - 'scripts/check-agda-verification.sh'
      - '.github/workflows/agda-cross-project.yml'
  push:
    branches: [main]
    paths:
      - 'verification/proofs/agda/**'
      - 'scripts/check-agda-verification.sh'
      - '.github/workflows/agda-cross-project.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agda-cross-project-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Use Ubuntu's GHC/Cabal packages rather than an additional
      # marketplace setup action; the proof compiler itself is pinned.
      - name: Install Haskell build toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ghc cabal-install
          # Hosted runners also contain newer GHC versions whose 'base'
          # package is incompatible with Agda 2.7.0.1. Choose the distro
          # compiler explicitly, not the first ghc found on PATH.
          /usr/bin/ghc --version
          cabal --version

      - name: Install Agda 2.7.0.1 and compatible stdlib 2.1.1
        run: |
          set -euo pipefail
          cabal update
          cabal install Agda-2.7.0.1 --with-compiler=/usr/bin/ghc --overwrite-policy=always
          echo "$HOME/.cabal/bin" >> "$GITHUB_PATH"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/agda-stdlib.tar.gz" \
            https://github.com/agda/agda-stdlib/archive/refs/tags/v2.1.1.tar.gz
          tar xzf "$RUNNER_TEMP/agda-stdlib.tar.gz" -C "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/agda-stdlib-2.1.1/standard-library.agda-lib"

      - name: Fetch pinned first-party Agda libraries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/type-libs"
          git clone --no-checkout https://github.com/hyperpolymath/absolute-zero.git "$RUNNER_TEMP/type-libs/absolute-zero"
          git -C "$RUNNER_TEMP/type-libs/absolute-zero" checkout bb46232ea4dbc4b6ad2b97d2da6baebb3e026662
          git clone --no-checkout https://github.com/hyperpolymath/echo-types.git "$RUNNER_TEMP/type-libs/echo-types"
          git -C "$RUNNER_TEMP/type-libs/echo-types" checkout b0982c44f36133acd2d0e1d4e03cf031fff7a470

      - name: Register exact proof library revisions
        run: |
          set -euo pipefail
          agda --version
          stdlib="$RUNNER_TEMP/agda-stdlib-2.1.1/standard-library.agda-lib"
          test -f "$stdlib"
          mkdir -p "$HOME/.agda"
          printf '%s\n' \
            "$stdlib" \
            "$RUNNER_TEMP/type-libs/absolute-zero/absolute-zero.agda-lib" \
            "$RUNNER_TEMP/type-libs/echo-types/echo-types.agda-lib" \
            > "$HOME/.agda/libraries"
          printf 'standard-library\n' > "$HOME/.agda/defaults"

      - name: Check full Agda profile
        run: bash scripts/check-agda-verification.sh
