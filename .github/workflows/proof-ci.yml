# Copyright (c) 2026 Jonathan D.A. Jewell (hyperpolymath) <j.d.a.jewell@open.ac.uk>
#
# Proof CI — audits the proof ledger and compiles the recheck legs it declares,
# via `just proof-witness-check` (issue #57).
#
# Scope, per metadatastician/standards 3-practice/PROOF-POLICY.adoc (the pin
# this repository audits against is in LEDGER.json .policy.proof_policy) and mathesis
# `estate-mathematical-architecture`:
#
#   * §1: a theory proof's source of truth is Agda. XP-1's Agda leg is RECORDED
#     in verification/proofs/LEDGER.json (commit + run + assumptions pinned),
#     audited for form here, and re-typechecked on every run (`just proof-check-agda`)
#     under `agda --safe --without-K --cubical-compatible`.
#   * §2: that statement must be rechecked in Rocq AND Lean — transported
#     through Dedukti/Lambdapi or re-proved by hand, with the statement
#     comparison recorded and no Mathlib. Both XP-1 recheck legs
#     (`verification/proofs/coq/EchoTyping.v` and
#     `verification/proofs/lean4/EchoTyping.lean`) are gated and checked here via
#     `coqchk -silent -o` + `Print Assumptions` (Rocq) and `#print axioms` +
#     `Lean.Environment.getModuleIdxFor?` module-origin verification (Lean 4).
#   * §5/§6: status is the closed vocabulary (open | argued | tested-only |
#     proven-with-postulates | proven); a grade must be supported by the legs
#     behind it; axioms are tracked (`Print Assumptions`, `#print axioms`), not
#     assumed; receipts are pinned to a commit.
#   * §7: a gate must be verified BOTH WAYS. tests/proofs/run-controls.sh runs
#     two halves: run-ledger-controls.sh (55 ledger controls, no prover needed)
#     plants a grade with no leg behind it, contradictory history, an unjustified
#     regression, flag drift, statement drift, a missing escape-hatch mechanism,
#     an unrecorded flag deviation, a non-existent anchor, a ghost source file
#     and an unclaimed witness on disk — each must be refused for the stated
#     reason, while an honest evidenced regression must still pass; and the
#     kernel half (17 kernel & witness controls) verifies `check-proofs.sh`
#     both ways on closed, declared-axiom, cross-module imported-axiom,
#     cross-module `sorryAx`, and `Admitted`-in-`.axioms` witnesses.
#
# The Grade 3 claim itself is substantiated rather than labelled: the ledger
# names the Agda declarations that carry the statement (and the gate re-reads
# their types out of the file), records the flags in force (read out of the
# proof files and out of the instrument, not copied by hand), records the
# escape-hatch mechanism, and records the deviation from the configurations
# mathesis §5 names parenthetically. Any drift in those fails the run.
#
# What this lane refuses, and why it exists: before it, `just proof-check-all`
# was never invoked by CI and each recipe ended in
# `SKIP: <prover> not installed; exit 0`. The proofs were asserted, not
# enforced. This lane is deliberately intolerant:
#
#   * a proof source that is not in the ledger / a MANIFEST  -> FAIL
#   * a ledger or manifest entry with no file behind it      -> FAIL
#   * the registries disagreeing                             -> FAIL
#   * a grade the proven legs do not support                 -> FAIL
#   * nothing checked at all ("green on zero work")          -> FAIL
#   * a required prover not installed                        -> BLOCKED (fails)
#   * a proof that does not typecheck                        -> FAIL
#
# There is no `continue-on-error` in this workflow, and no step is skipped when
# a tool is missing: a missing toolchain makes the run red, which is the point.
#
# A green run does NOT mean XP-1 is verified in an independent kernel. It means
# the ledger is honest about what has and has not been proven. Today it records
# Grade 3 (Agda only) with both recheck legs open.
#
# Toolchains are pinned so the lane cannot float:
#   * Agda 2.8.0 — official release binary, sha256-verified before extraction
#   * just 1.59.0 — exact version, installed from crates.io with --locked
#   * Rocq/Coq 8.18 — Ubuntu 24.04's package, version asserted after install
#   * Lean 4 — official release archive, exact version asserted
#   * libraries — agda-stdlib v2.4 (tag + commit asserted), echo-types and
#     absolute-zero pinned by commit, each re-verified after checkout
#
# Receipts (versions, pins, ledger hash, census, policy gaps, per-prover
# results) are written to target/proof-receipts/ and uploaded as the
# `proof-receipts` artifact.
name: Proof CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'verification/proofs/**'
      - '.machine_readable/bot_directives/placement.a2ml'
      - 'scripts/check-coordination-boundary.sh'
      - 'scripts/check-proof-enrolment.sh'
      - 'scripts/check-proof-ledger.sh'
      - 'scripts/check-proofs.sh'
      - 'scripts/proof-scan-dangerous.sh'
      - 'tests/proofs/**'
      - 'Justfile'
      - 'PROOF-NEEDS.adoc'
      - 'PROOF-STATUS.adoc'
      # Scanner policy inputs. .trusted-base-ignore decides which files the
      # escape-hatch scan exempts and docs/proof-debt.md is the register it
      # requires: changing either changes what the gate means, so either must
      # run the gate.
      - '.trusted-base-ignore'
      - 'docs/proof-debt.md'
      - 'docs/proof-debt.adoc'
      - '.github/workflows/proof-ci.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'verification/proofs/**'
      - '.machine_readable/bot_directives/placement.a2ml'
      - 'scripts/check-coordination-boundary.sh'
      - 'scripts/check-proof-enrolment.sh'
      - 'scripts/check-proof-ledger.sh'
      - 'scripts/check-proofs.sh'
      - 'scripts/proof-scan-dangerous.sh'
      - 'tests/proofs/**'
      - 'Justfile'
      - 'PROOF-NEEDS.adoc'
      - 'PROOF-STATUS.adoc'
      # Scanner policy inputs, as in the push filter above.
      - '.trusted-base-ignore'
      - 'docs/proof-debt.md'
      - 'docs/proof-debt.adoc'
      - '.github/workflows/proof-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proof-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AGDA_VERSION: '2.8.0'
  # sha256 of Agda-v2.8.0-linux.tar.xz (official GitHub release asset, agda/agda)
  AGDA_LINUX_SHA256: '824081b8dcbe431289a50ac6bd83e451f390c51c3884ac7a8c4a5c0df2632faf'
  JUST_VERSION: '1.59.0'
  # Ubuntu 24.04 (noble) ships this exact Rocq/Coq build; asserted below.
  ROCQ_VERSION: '8.18'
  # No Mathlib (PROOF-POLICY §2): the lean leg must be core Lean. Asserted below.
  LEAN_VERSION: '4.15.0'
  STDLIB_TAG: 'v2.4'
  STDLIB_COMMIT: '2a5a0dec0a3cb5c87468ce101388a513d39dbf10'
  # echo-types: the library the XP-1 proof is *about* (PROOF-STATUS.adoc).
  # absolute-zero: declared dependency of echo-types' own .agda-lib.
  ECHO_TYPES_COMMIT: 'b0982c44f36133acd2d0e1d4e03cf031fff7a470'
  ABSOLUTE_ZERO_COMMIT: 'f486c29903434589117fa0662c6f29b0f17d1d5f'
  PROOF_RECEIPT_DIR: 'target/proof-receipts'

jobs:
  proofs:
    name: just proof-witness-check (strict)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # Nothing later in the lane pushes; the one clone it makes is of a
          # public library. Leaving the job token in .git/config would be a
          # credential in a runner that only reads.
          persist-credentials: false

      - name: Install pinned Agda (official binary, sha256-verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/agda" "$HOME/.local/bin"
          # The scheme is written at the call site and pinned with --proto so a
          # redirect cannot downgrade the transfer to clear text: the archive is
          # the interpreter for every Agda receipt in the ledger.
          curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 \
            -o "$RUNNER_TEMP/agda.tar.xz" \
            "https://github.com/agda/agda/releases/download/v${AGDA_VERSION}/Agda-v${AGDA_VERSION}-linux.tar.xz"
          echo "${AGDA_LINUX_SHA256}  $RUNNER_TEMP/agda.tar.xz" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/agda.tar.xz" -C "$RUNNER_TEMP/agda"
          install -m 0755 "$RUNNER_TEMP/agda/agda" "$HOME/.local/bin/agda"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/agda" --version
          "$HOME/.local/bin/agda" --setup

      - name: Install pinned just
        run: |
          set -euo pipefail
          command -v cargo >/dev/null 2>&1 \
            || { echo "::error::cargo is required to build the pinned just; refusing to continue"; exit 1; }
          cargo install just --version "${JUST_VERSION}" --locked
          command -v just
          just --version

      - name: Install pinned Rocq (Ubuntu package, version asserted)
        run: |
          set -euo pipefail
          sudo apt-get update
          # zstd is for the Lean archive; coq is the Rocq recheck leg's compiler.
          sudo apt-get install -y --no-install-recommends coq zstd
          for tool in coqc coqtop coqchk; do command -v "$tool"; done
          coqc --version
          coqc --version | grep -F "${ROCQ_VERSION}" \
            || { echo "::error::Rocq is not the pinned ${ROCQ_VERSION}"; coqc --version; exit 1; }

      - name: Install pinned Lean 4 (official release archive, version asserted)
        run: |
          set -euo pipefail
          # Core Lean only. Mathlib is forbidden by PROOF-POLICY §2, so nothing
          # here fetches a package cache or a library: the leg must stand on the
          # Lean kernel alone.
          NAME="lean-${LEAN_VERSION}-linux.tar.zst"
          mkdir -p "$RUNNER_TEMP/lean-dl" "$RUNNER_TEMP/lean"
          curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 \
            -o "$RUNNER_TEMP/lean-dl/$NAME" \
            "https://github.com/leanprover/lean4/releases/download/v${LEAN_VERSION}/${NAME}"
          # The release asset ships no published digest, so the archive identity
          # is recorded rather than asserted against an upstream constant. The
          # version assertion below is what actually pins the toolchain: a
          # substituted archive that is not this Lean fails the step.
          echo "$(stat -c%s "$RUNNER_TEMP/lean-dl/$NAME") bytes  sha256 $(sha256sum "$RUNNER_TEMP/lean-dl/$NAME" | cut -d' ' -f1)" \
            | tee "$RUNNER_TEMP/lean-dl/archive.txt"
          tar --zstd -xf "$RUNNER_TEMP/lean-dl/$NAME" -C "$RUNNER_TEMP/lean"
          # Do NOT copy the binaries elsewhere: Lean resolves its core library
          # relative to the executable, so a copied binary loses its sysroot.
          echo "$RUNNER_TEMP/lean/lean-${LEAN_VERSION}-linux/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/lean/lean-${LEAN_VERSION}-linux/bin:$PATH"
          command -v lean lake
          lean --version
          lean --version | grep -F "${LEAN_VERSION}" \
            || { echo "::error::Lean is not the pinned ${LEAN_VERSION}"; lean --version; exit 1; }
          lake --version

      - name: Fetch pinned proof libraries
        id: libs
        run: |
          set -euo pipefail
          # Initialise $2, fetch and check out $3 from $1, and exit 1 if HEAD
          # differs from $3. Git errors terminate this step under set -e.
          fetch_pinned() {  # $1=url $2=dest $3=expected commit
            git init -q "$2"
            git -C "$2" remote add origin "$1"
            git -C "$2" fetch -q --depth 1 origin "$3"
            git -C "$2" checkout -q FETCH_HEAD
            actual="$(git -C "$2" rev-parse HEAD)"
            if [ "$actual" != "$3" ]; then
              echo "::error::pin mismatch for $1: want $3 got $actual"
              exit 1
            fi
            echo "pinned $1 at $actual"
          }

          # standard-library: tag and commit both asserted (a moved tag fails).
          git clone -q --depth 1 --branch "$STDLIB_TAG" \
            https://github.com/agda/agda-stdlib.git "$RUNNER_TEMP/agda-stdlib"
          actual="$(git -C "$RUNNER_TEMP/agda-stdlib" rev-parse HEAD)"
          if [ "$actual" != "$STDLIB_COMMIT" ]; then
            echo "::error::agda-stdlib $STDLIB_TAG moved: want $STDLIB_COMMIT got $actual"
            exit 1
          fi
          echo "pinned agda-stdlib $STDLIB_TAG at $actual"

          fetch_pinned https://github.com/hyperpolymath/echo-types.git \
            "$RUNNER_TEMP/echo-types" "$ECHO_TYPES_COMMIT"
          fetch_pinned https://github.com/hyperpolymath/absolute-zero.git \
            "$RUNNER_TEMP/absolute-zero" "$ABSOLUTE_ZERO_COMMIT"

      - name: Register Agda libraries
        run: |
          set -euo pipefail
          AGDA_DIR="$(agda --print-agda-app-dir)"
          mkdir -p "$AGDA_DIR"

          # The upstream stdlib manifest is named `standard-library-2.3`, but
          # nextgen-typing.agda-lib and echo-types.agda-lib both depend on
          # `standard-library`, so register a manifest under that exact name
          # (same include, same flags as upstream v2.4).
          STDLIB_LIB="$RUNNER_TEMP/standard-library.agda-lib"
          {
            echo "name: standard-library"
            echo "include: $RUNNER_TEMP/agda-stdlib/src"
            echo "flags:"
            echo "  --warning=noUnsupportedIndexedMatch"
          } > "$STDLIB_LIB"

          # Register the upstream manifests of the two pinned dependencies so
          # their declared dependency graph (echo-types -> standard-library,
          # absolute-zero) is honoured rather than shadowed, plus this repo's
          # own manifest (the authority for the proof include path and for the
          # standard-library / echo-types dependency).
          for lib in "$RUNNER_TEMP/echo-types/echo-types.agda-lib" \
                     "$RUNNER_TEMP/absolute-zero/absolute-zero.agda-lib" \
                     "$GITHUB_WORKSPACE/verification/proofs/agda/nextgen-typing.agda-lib"; do
            [ -f "$lib" ] || { echo "::error::missing Agda library manifest: $lib"; exit 1; }
            echo "registering $lib"
          done

          printf '%s\n%s\n%s\n%s\n' \
            "$STDLIB_LIB" \
            "$RUNNER_TEMP/echo-types/echo-types.agda-lib" \
            "$RUNNER_TEMP/absolute-zero/absolute-zero.agda-lib" \
            "$GITHUB_WORKSPACE/verification/proofs/agda/nextgen-typing.agda-lib" \
            > "$AGDA_DIR/libraries"
          printf 'standard-library\n' > "$AGDA_DIR/defaults"
          echo "AGDA_DIR=$AGDA_DIR"
          cat "$AGDA_DIR/libraries"

      - name: Toolchain receipt
        run: |
          set -euo pipefail
          mkdir -p "$PROOF_RECEIPT_DIR"
          {
            echo "proof-ci toolchain receipt"
            echo "generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit: $GITHUB_SHA"
            echo "workflow-run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "runner-image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "agda: $(agda --version | head -n1)"
            echo "just: $(just --version)"
            echo "rocq: $(coqc --version | head -n1)"
            echo "coqchk: $(coqchk --version 2>&1 | head -n1)"
            echo "rocq deb: $(dpkg-query -W -f='${Version}' coq 2>/dev/null || echo unknown)"
            echo "lean: $(lean --version | head -n1)"
            echo "lean archive: $(cat "$RUNNER_TEMP/lean-dl/archive.txt" 2>/dev/null || echo unknown)"
            echo "agda-stdlib: $STDLIB_TAG @ $STDLIB_COMMIT"
            echo "echo-types: $ECHO_TYPES_COMMIT"
            echo "absolute-zero: $ABSOLUTE_ZERO_COMMIT"
            echo "placement.a2ml sha256: $(sha256sum .machine_readable/bot_directives/placement.a2ml | cut -d' ' -f1)"
            echo "check-coordination-boundary.sh sha256: $(sha256sum scripts/check-coordination-boundary.sh | cut -d' ' -f1)"
          } | tee "$PROOF_RECEIPT_DIR/toolchain.txt"

          # Version assertions: the lane must not silently run a different prover.
          agda --version | grep -F "${AGDA_VERSION}" \
            || { echo "::error::Agda version is not the pinned ${AGDA_VERSION}"; agda --version; exit 1; }
          just --version | grep -F "${JUST_VERSION}" \
            || { echo "::error::just version is not the pinned ${JUST_VERSION}"; just --version; exit 1; }
          coqc --version | grep -F "${ROCQ_VERSION}" \
            || { echo "::error::Rocq version is not the pinned ${ROCQ_VERSION}"; coqc --version; exit 1; }
          command -v coqchk >/dev/null 2>&1 \
            || { echo "::error::coqchk is missing from the Rocq installation"; exit 1; }
          lean --version | grep -F "${LEAN_VERSION}" \
            || { echo "::error::Lean version is not the pinned ${LEAN_VERSION}"; lean --version; exit 1; }

      - name: Enrolment gate (unlisted proofs, registry drift, missing provers)
        run: just proof-enrolment

      # PROOF-POLICY §7: a gate that has only ever been seen to pass is
      # indistinguishable from one that cannot fail. These controls feed the
      # instrument closed proofs (must pass) and planted violations (must fail)
      # before the lane is trusted with the real ledger. exit 2 = BLOCKED, which
      # fails this step: an instrument that could not be exercised proved nothing.
      - name: Instrument controls, both ways (§7)
        run: |
          set -o pipefail
          mkdir -p "$PROOF_RECEIPT_DIR"
          bash tests/proofs/run-controls.sh 2>&1 | tee "$RUNNER_TEMP/proof-controls.log" "$PROOF_RECEIPT_DIR/controls.txt"

      # The CI target: audit the ledger, then compile every recheck leg the
      # ledger declares. XP-1 declares Rocq and Lean 4, both `open`, so these
      # compile zero modules — and the ledger gate refuses any claim that they
      # compiled. The gate's receipt (census + POLICY GAP lines) is written to
      # $PROOF_RECEIPT_DIR/ledger.txt by `just proof-ledger-check`.
      - name: Ledger audit + declared recheck legs (Rocq, Lean 4)
        run: |
          set -o pipefail
          just proof-witness-check 2>&1 | tee "$RUNNER_TEMP/proof-witness-check.log"

      # "PASS" from a per-prover step must never be reachable with nothing
      # compiled. scripts/check-proofs.sh is the estate instrument and is used
      # verbatim, so its zero-module case is closed around it here: if the ledger
      # records a proven Rocq/Lean leg, that leg's MANIFEST must list at least one
      # gated module. With no proven legs (today) zero compiled modules is the
      # honest count and is stated as such, not glossed as a pass.
      - name: Zero-work guard (a proven leg cannot compile nothing)
        run: |
          set -euo pipefail
          LEDGER=verification/proofs/LEDGER.json
          bad=0
          checked_legs=0
          while IFS= read -r leg; do
            [ -z "$leg" ] && continue
            case "$leg" in
              rocq|coq)  dir=coq;   prover="Rocq" ;;
              lean4|lean) dir=lean4; prover="Lean 4" ;;
              *) continue ;;
            esac
            checked_legs=$((checked_legs + 1))
            gated="$(awk -F'|' '/^[[:space:]]*#/ || NF < 3 { next } $3 == "gated" { c++ } END { print c+0 }' "verification/proofs/$dir/MANIFEST")"
            echo "$prover: ledger records a proven leg; $dir/MANIFEST lists $gated gated module(s)"
            if [ "$gated" -lt 1 ]; then
              echo "::error::zero-work: the ledger records a proven $prover leg but verification/proofs/$dir/MANIFEST lists no gated module"
              bad=1
            fi
          done < <(jq -r '.theorems[].legs[]? | select(.status == "proven" or .status == "proven-with-postulates") | .prover' "$LEDGER" | sort -u)
          if [ "$bad" -ne 0 ]; then exit 1; fi
          if [ "$checked_legs" -eq 0 ]; then
            echo "no recheck leg is recorded proven, so zero compiled recheck modules is the honest count — not a pass"
          else
            echo "all $checked_legs proven recheck leg(s) carry gated MANIFEST entries"
          fi

      # The Agda SOURCE leg. PROOF-POLICY §1 makes Agda the source of truth; the
      # ledger records it at a pinned commit and the audit checks that record.
      # Typechecking it here keeps the recorded status true rather than assumed.
      - name: Agda source leg (recorded in the ledger, re-typechecked here)
        run: |
          set -o pipefail
          just proof-check-agda 2>&1 | tee "$RUNNER_TEMP/proof-agda.log"

      # A green run means "the ledger is honest", NOT "the theorem is verified in
      # an independent kernel". Say so on the check run itself, where it cannot
      # be missed by someone who only reads the badge.
      - name: Announce policy gaps (recorded, not verified)
        run: |
          set -uo pipefail
          RECEIPT="$PROOF_RECEIPT_DIR/ledger.txt"
          if [ ! -f "$RECEIPT" ]; then
            echo "::error::no ledger receipt was written after the ledger gate succeeded"
            exit 1
          fi
          GAPS="$(awk '/^gaps:/{f=1;next} /^[a-z-]+:/{f=0} f' "$RECEIPT" | sed 's/^  - //')"
          if [ -z "${GAPS//[[:space:]]/}" ] || [ "$GAPS" = "(none)" ]; then
            echo "no policy gaps recorded"
            exit 0
          fi
          while IFS= read -r gap; do
            [ -z "${gap// }" ] && continue
            echo "::warning::PROOF-POLICY §2 obligation UNMET (recorded as open, not verified):%0A${gap}"
          done <<< "$GAPS"

      # Diagnostics only: the run is already red by the time this executes.
      # Proof failures are annotated so the failing module/error is visible in
      # the PR and via the check-run API without unzipping raw runner logs.
      - name: Surface prover diagnostics
        if: failure()
        run: |
          set -uo pipefail
          found_log=0
          for candidate in "$RUNNER_TEMP/proof-controls.log" "$RUNNER_TEMP/proof-witness-check.log" "$RUNNER_TEMP/proof-agda.log"; do
            [ -f "$candidate" ] || continue
            found_log=1
            label="$(basename "$candidate")"
            PAYLOAD="$(grep -vE '^[[:space:]]*$' "$candidate" | tail -n 40 | tail -c 3500 | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error::${label} tail:%0A${PAYLOAD}"
            {
              echo "### ${label} tail (failure diagnostics)"
              echo '```'
              tail -n 60 "$candidate"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$found_log" -eq 0 ]; then
            echo "::error::proof-ci failed before producing step logs; see the step logs above"
          fi

      - name: Note receipts
        run: |
          if [ -f "$RUNNER_TEMP/lean-dl/archive.txt" ]; then
            echo "::notice::lean-archive: $(cat "$RUNNER_TEMP/lean-dl/archive.txt")"
          fi
          for wf in "$PROOF_RECEIPT_DIR/witness-coq.txt" "$PROOF_RECEIPT_DIR/witness-lean4.txt"; do
            if [ -f "$wf" ]; then
              wpayload="$(grep -vE '^[[:space:]]*$' "$wf" | tail -n 35 | tail -c 3000 | sed ':a;N;$!ba;s/\n/%0A/g')"
              echo "::notice::$(basename "$wf"):%0A${wpayload}"
            fi
          done
          echo "## Proof CI receipts" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for f in "$PROOF_RECEIPT_DIR"/*.txt; do
            [ -f "$f" ] || continue
            echo "### $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: proof-receipts
          path: target/proof-receipts/
          retention-days: 90
          if-no-files-found: warn
